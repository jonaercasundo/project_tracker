<IfModule mod_ssl.c>
<VirtualHost *:443>


    ServerName tracker.metro-mobilia.com


    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyRequests Off

    ProxyPreserveHost On


    ProxyPass /app/ http://127.0.0.1:9092/app/ upgrade=websocket timeout=600
    ProxyPassReverse /app/ http://127.0.0.1:9092/app/

    ProxyPass / http://127.0.0.1:9092/

    ProxyPassReverse / http://127.0.0.1:9092/


    ErrorLog ${APACHE_LOG_DIR}/tracker_error.log

    CustomLog ${APACHE_LOG_DIR}/tracker_access.log combined



SSLCertificateFile /etc/letsencrypt/live/tracker.metro-mobilia.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/tracker.metro-mobilia.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
